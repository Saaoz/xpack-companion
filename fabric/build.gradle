// Point d'entrée Fabric. Aucune dépendance à Fabric API : uniquement des mixins vanilla.
apply plugin: "fabric-loom"

base {
    archivesName = "xpack-companion-fabric-${minecraft_version}"
}

loom {
    mixin {
        defaultRefmapName = "xpack.refmap.json"
    }
    runs {
        // Test de bout en bout dans le vrai client : voir mod/README.md et mod/smoke-test.sh.
        smoke {
            client()
            name = "Smoke test"
            runDir = "run-smoke"
            property("xpack.smoke", "true")
            // Jetons du test dans run-smoke/, jamais dans le dossier utilisateur de la machine.
            property("xpack.credentials", file("run-smoke/xpack-credentials.json").absolutePath)
            programArgs("--username", "SmokeTester", "--quickPlaySingleplayer", "SmokeWorld")
        }
    }
}

repositories {
    // Mod Menu : bouton « Réglages » dans la liste des mods (facultatif à l'exécution).
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modCompileOnly("com.terraformersmc:modmenu:${modmenu_version}") { transitive = false }
}

// Code partagé : logique pure (common) + code Minecraft vanilla (shared).
sourceSets.main {
    java.srcDirs += ["${rootDir}/common/src/main/java", "${rootDir}/shared/src/main/java"]
    resources.srcDirs += ["${rootDir}/shared/src/main/resources"]
}

processResources {
    from("${rootDir}/../spec/integrity-rules.json") { into("xpack") }
    inputs.property("version", project.version)
    filesMatching("fabric.mod.json") {
        expand("version": project.version, "minecraft_version": minecraft_version, "loader_version": fabric_loader_version)
    }
}
