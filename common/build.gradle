dependencies {
    // Gson est fourni par Minecraft à l'exécution.
    compileOnly "com.google.code.gson:gson:${gson_version}"
    testImplementation "com.google.code.gson:gson:${gson_version}"
    testImplementation platform("org.junit:junit-bom:5.11.3")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Java 8 : le cœur sert aussi le portage Minecraft 1.12.2 (forge1122/). Les tests restent compilés en Java 21.
compileJava {
    options.release = 8
}

// Les règles anti-triche sont la source unique partagée avec le site (spec/integrity-rules.json).
sourceSets.main.resources.srcDir("${rootDir}/../spec")
processResources {
    include("integrity-rules.json")
    eachFile { path = "xpack/${name}" }
}

test {
    // Fixtures réelles partagées avec l'API (spec/launcher-fixtures).
    systemProperty "xpack.spec", "${rootDir}/../spec"
    useJUnitPlatform()
}
